<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financing Lab</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><div class="top hero"><div class="eyebrow">Financing Lab</div><h1>La deuda amplifica retorno y downside</h1></div></header><main><div class="controls"><label>Precio<input id="price" type="range" min="50000" max="200000" value="111900"><output id="price-o"></output></label><label>Entrada<input id="entry" type="range" min="10000" max="100000" value="41400"><output id="entry-o"></output></label><label>Interés<input id="rate" type="range" min="3" max="8" step=".25" value="5.5"><output id="rate-o"></output></label><label>Plazo<input id="years" type="range" min="5" max="25" value="15"><output id="years-o"></output></label></div><div id="results" class="grid"></div><section><h2>Sensibilidad de tipos</h2><div id="rates"></div></section><div class="notice">Modelo pre-tax. DSCR = NOI / servicio anual de deuda. Menos de 1 no cubre la cuota; 1–1,2 exige alerta; más de 1,5 ofrece más holgura.</div></main><footer></footer><script type="module" src="assets/js/financing.js"></script></body></html>
