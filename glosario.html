<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glosario ADE</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><header><div class="top hero"><h1>Glosario para 1.º de ADE</h1></div></header><main id="terms"></main><footer></footer><script type="module">import{mount}from'/assets/js/common.js';mount();const t=[['roi','ROI','Ganancia total respecto al capital.','(valor final + caja − inversión) / inversión','Invertir 100 y terminar con 250 da 150 %.','No equivale a 15 % anual.'],['tir','TIR','Tasa anual que hace VAN = 0.','0 = Σ flujoₜ/(1+TIR)ᵗ','Compara cuándo llega la caja.','Confundirla con ROI.'],['van','VAN','Valor hoy de los flujos futuros menos inversión.','Σ flujoₜ/(1+k)ᵗ','VAN positivo crea valor a la tasa k.','Elegir k arbitrariamente.'],['moic','MOIC','Euros recuperados por euro invertido.','Cobros totales / capital','2× devuelve dos euros por cada euro.','Ignorar el tiempo.'],['equity','Equity','Capital propio y patrimonio neto.','Activo − deuda','Activo 100, deuda 60: equity 40.','Confundir equity con project cost.'],['dscr','DSCR','Cobertura del servicio de deuda.','EBITDA / cuota anual','1,30× deja 30 % de colchón.','Usar ingresos en vez de caja operativa.'],['ltv','LTV','Deuda respecto al valor del activo.','Deuda / valor','70 de deuda sobre 100 = 70 %.','Usar precio futuro optimista.'],['payback','Payback','Tiempo hasta recuperar caja desembolsada.','Primer momento con caja acumulada ≥ 0','4,2 años recupera a mitad del quinto.','Contar residual no vendido como caja.'],['yield','Yield neto','Renta neta anual sobre coste o valor.','(renta−OPEX)/base','5.000/50.000=10 %.','No decir qué base se usa.']];document.querySelector('#terms').innerHTML=t.map(x=>`<article id="${x[0]}" class="card full" style="margin:12px 0"><h2>${x[1]}</h2><p><b>Definición:</b> ${x[2]}</p><p><b>Fórmula:</b> <code>${x[3]}</code></p><p><b>Ejemplo/interpretación:</b> ${x[4]}</p><p><b>Error típico:</b> ${x[5]}</p></article>`).join('')</script></body></html>
