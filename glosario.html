<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glosario financiero</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><div class="breadcrumb"><a href="/index.html">Investment Decision Lab</a> / Glosario</div><header class="page-header"><div><h1>Glosario financiero</h1><p class="page-subtitle">Definiciones, fórmulas, interpretación y errores típicos para 1.º de ADE.</p></div></header><label for="glossary-search" class="filter-label">Buscar término</label><input id="glossary-search" class="glossary-search" type="search" placeholder="Ej.: TIR, residual, deuda…" autocomplete="off"><p id="result-count" class="section-note"></p><section class="section grid" id="terms"></section><script type="module">
import{mountShell}from'/assets/js/ui.js';mountShell();
const terms=[['ROI','Rentabilidad','Ganancia total respecto al capital.','(valor final + caja − inversión) / inversión','150 % no significa 15 % anual.'],['TIR','Rentabilidad','Tasa anual que hace VAN igual a cero.','0 = Σ flujoₜ/(1+TIR)ᵗ','No incorpora automáticamente el riesgo.'],['VAN','Valoración','Valor hoy de flujos futuros.','Σ flujoₜ/(1+k)ᵗ','Depende de la tasa de descuento.'],['MOIC','Rentabilidad','Euros recuperados por euro invertido.','Cobros / capital','Ignora cuándo llega la caja.'],['Payback','Liquidez','Tiempo para recuperar el desembolso.','Caja acumulada ≥ 0','No contar residual sin vender.'],['DSCR','Deuda','Cobertura anual de la deuda.','Caja disponible / servicio deuda','Usar caja, no ingresos brutos.'],['LTV','Deuda','Deuda sobre valor del activo.','Deuda / valor','No aplica a todo negocio.'],['Residual','Valoración','Valor estimado del activo al final.','Valor A10 según método','No es caja hasta vender.'],['Equity','Capital','Capital propio o activo menos deuda.','Activo − deuda','No confundir con project cost.'],['OPEX','Operación','Gastos recurrentes.','Seguro + mantenimiento + …','No omitir downtime.'],['CAPEX','Capital','Inversión duradera inicial/futura.','Compra + obra + puesta en marcha','No olvidar capital calls.'],['Break-even','Operación','Nivel que cubre costes.','Costes fijos / margen unitario','Cubrir OPEX no implica recuperar CAPEX.']];
const root=document.querySelector('#terms'),search=document.querySelector('#glossary-search');function render(){const q=search.value.toLowerCase(),filtered=terms.filter(t=>t.join(' ').toLowerCase().includes(q));root.innerHTML=filtered.map(t=>`<article class="panel span-6"><span class="badge info">${t[1]}</span><h2>${t[0]}</h2><p><b>Definición:</b> ${t[2]}</p><div class="formula">${t[3]}</div><p><b>Error típico:</b> ${t[4]}</p></article>`).join('')||'<div class="empty span-12">No hay términos coincidentes.</div>';document.querySelector('#result-count').textContent=`${filtered.length} términos`}search.oninput=render;render();
</script></body></html>
