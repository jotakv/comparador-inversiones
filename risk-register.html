<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risk register</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><div class="top hero"><div class="eyebrow">Risk register</div><h1>Riesgo = probabilidad × impacto</h1><p class="lead">Las probabilidades son supuestos editables, no frecuencias históricas.</p></div></header><main><div id="summary" class="grid"></div><div id="risks"></div></main><footer></footer><script type="module">import{load,mount,euro,pct,table}from'./assets/js/common.js';mount();const r=await load('data/risk-register.json');document.querySelector('#summary').innerHTML=[...new Set(r.map(x=>x.investment))].map(id=>{const z=r.filter(x=>x.investment===id).reduce((s,x)=>s+x.expectedLoss,0);return `<article class="card"><h3>${id}</h3><div class="kpi">${euro(z)}</div><small>Pérdida esperada identificada</small></article>`}).join('');document.querySelector('#risks').innerHTML=table(r,[['Inversión',x=>x.investment],['Categoría',x=>x.category],['Riesgo',x=>x.risk],['Probabilidad*',x=>pct(x.probability)],['Impacto',x=>euro(x.impact)],['Expected loss',x=>euro(x.expectedLoss)],['Mitigación',x=>x.mitigation],['Residual',x=>x.residualRisk]]);</script></body></html>
